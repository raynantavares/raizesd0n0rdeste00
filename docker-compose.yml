services:
  postgres:
    image: postgres:16-alpine
    container_name: raizes-nordeste-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: raizes
      POSTGRES_PASSWORD: raizes
      POSTGRES_DB: raizes_nordeste
    volumes:
      - raizes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raizes -d raizes_nordeste']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raizes_pg_data:
